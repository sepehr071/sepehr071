name: Chess vs. the AI Coach

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  models: read

# No concurrency group on purpose: a group keeps only ONE pending run and cancels the rest,
# which would leave those issues open with no reply. Races are handled by the retry loop below.

jobs:
  move:
    if: startsWith(github.event.issue.title, 'chess:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPLY_FILE: /tmp/chess-reply.md
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python-chess and Stockfish
        run: |
          pip install -q -r chess/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq stockfish || echo "stockfish unavailable, using fallback engine"

      - name: Play the move, commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # If someone else's move lands first, the push is rejected: reset to the new main
          # and replay this issue against the fresh position (it may now be illegal, which is fine).
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main && git clean -fdq chess/
            python chess/play.py play
            git add README.md chess/
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "chess: move by @$ISSUE_AUTHOR (#$ISSUE_NUMBER)"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Comment and close the issue
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python chess/play.py reply
