name: arcade

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arcade
  cancel-in-progress: false

jobs:
  breakout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # writes dist/breakout-contribution-graph.svg and dist/breakout-contribution-graph-dark.svg
      - uses: abozanona/pacman-contribution-graph@d258e3fb01511c1ff4fe6418408ede37b2ad4935 # v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          games: breakout

      - uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          # incremental commit so files other workflows put on 'output' survive
          keep_history: true
          commit_message: 'arcade: update breakout svgs'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
